name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: invariant fuzzing (25,000 random transactions)
        run: python -m jurisledger fuzz --runs 50 --steps 500
      - run: python -m jurisledger all
      - run: jurisledger cluster --out cluster
      - run: jurisledger demo --out demo && jurisledger audit demo/chain.json && jurisledger verify demo/evidence-cold-storage-lease.json demo/validators.json
