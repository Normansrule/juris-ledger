[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juris-ledger"
version = "0.6.0"
description = "Research framework: signed legal contracts, offline-verifiable evidence, fraud detection and verifiable national accounts on a Byzantine-fault-tolerant ledger"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aleksander Norman" }]
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout>=2"]

[project.scripts]
jurisledger = "jurisledger.__main__:main_cli"

[tool.setuptools.packages.find]
include = ["jurisledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
